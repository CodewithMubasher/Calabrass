name: CLI release

# `cli-v*` tags publish the terminal client to npm. They are separate from the
# `v*` tags used by the desktop installer, so a CLI release never creates or
# touches a desktop GitHub release.
on:
  push:
    tags: ["cli-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, platform: linux-x64, ext: "" }
          - { goos: linux, goarch: arm64, platform: linux-arm64, ext: "" }
          - { goos: darwin, goarch: amd64, platform: darwin-x64, ext: "" }
          - { goos: darwin, goarch: arm64, platform: darwin-arm64, ext: "" }
          - { goos: windows, goarch: amd64, platform: win32-x64, ext: ".exe" }
          - { goos: windows, goarch: arm64, platform: win32-arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: TUI/go.sum
      - name: Build
        working-directory: TUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -ldflags "-s -w" \
            -o "../npm-wrapper/platforms/calabrass-${{ matrix.platform }}/bin/calabrass-tui${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: calabrass-${{ matrix.platform }}
          path: npm-wrapper/platforms/calabrass-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: npm-wrapper/platforms
          pattern: calabrass-*
      - name: Take the version from the tag
        run: node npm-wrapper/scripts/prepare.js "${GITHUB_REF_NAME#cli-v}"
      - name: Publish the platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm-wrapper/platforms/calabrass-*/; do
            npm publish "$dir" --access public
          done
      - name: Publish calabrass
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish npm-wrapper --access public
