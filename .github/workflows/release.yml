name: CLI release

# `cli-v*` tags publish the terminal client to npm. They are separate from the
# `v*` tags used by the desktop installer, so a CLI release never creates or
# touches a desktop GitHub release.
on:
  push:
    tags: ["cli-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, platform: linux-x64, ext: "" }
          - { goos: linux, goarch: arm64, platform: linux-arm64, ext: "" }
          - { goos: darwin, goarch: amd64, platform: darwin-x64, ext: "" }
          - { goos: darwin, goarch: arm64, platform: darwin-arm64, ext: "" }
          - { goos: windows, goarch: amd64, platform: win32-x64, ext: ".exe" }
          - { goos: windows, goarch: arm64, platform: win32-arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: Backend/go.sum
      # The host serves the web interface itself, so the same build that ships
      # the API ships the page. It is built for the web (same-origin /api), not
      # for the desktop shell.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web interface
        working-directory: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          rm -rf ../Backend/internal/webui/dist
          mkdir -p ../Backend/internal/webui/dist
          cp -r dist/. ../Backend/internal/webui/dist/
      - name: Build TUI
        working-directory: TUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false -ldflags "-s -w" \
            -o "../npm-wrapper/binaries/calabrass-${{ matrix.platform }}/calabrass-tui${{ matrix.ext }}" .
      - name: Build Backend
        working-directory: Backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/CodewithMubasher/Calabrass/backend/internal/version.Version=${GITHUB_REF_NAME#cli-v}" \
            -o "../npm-wrapper/binaries/calabrass-${{ matrix.platform }}/calabrass-backend${{ matrix.ext }}" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: calabrass-${{ matrix.platform }}
          path: npm-wrapper/binaries/calabrass-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          path: npm-wrapper/binaries
          pattern: calabrass-*
      - name: Take the version from the tag
        run: node npm-wrapper/scripts/prepare.js "${GITHUB_REF_NAME#cli-v}"
      - name: Publish to npm
        working-directory: npm-wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if npm view "calabrass@$version" version >/dev/null 2>&1; then
            echo "calabrass@$version is already published; nothing to do"
            exit 0
          fi
          npm publish --access public
